<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Southern Cross - Engineering Tools</title>
    <meta name="description" content="APEX Southern Cross Engineering - Structural & PT Design Tools">
    <link rel="icon" type="image/png" href="img/apex_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <!-- ===== VIDEO INTRO OVERLAY ===== -->
    <div class="intro-overlay" id="introOverlay">
        <video class="intro-video" id="introVideo" autoplay muted playsinline>
            <source src="assets/intro.mp4" type="video/mp4">
        </video>

        <button class="intro-skip" id="introSkip" onclick="App.skipIntro()">
            Bỏ qua
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
    </div>

    <div class="app-shell hidden" id="appShell">

        <!-- Top Navigation -->
        <nav class="top-nav">
            <a class="nav-brand" onclick="App.goHome()" id="navBrand" title="APEX Southern Cross Engineering">
                <img src="img/apex_logo.png" alt="APEX Southern Cross Engineering" class="nav-brand-logo">
            </a>
            <button class="nav-back" id="navBack" onclick="App.goHome()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>Dashboard</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">

            <!-- ===== DASHBOARD VIEW ===== -->
            <div class="view active" id="dashboardView">
                <div class="dashboard-header">
                    <h1 class="dashboard-title">Apex Southern Cross Design</h1>
                    <p class="dashboard-subtitle">Choose a calculator software to get started</p>
                </div>

                <div class="tools-grid" id="toolsGrid">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- ===== TOOL VIEW (dynamic content) ===== -->
            <div class="tool-view" id="toolView">
                <div id="toolContent">
                    <!-- Rendered by JS when a tool is selected -->
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="footer-text">APEX Southern Cross Engineering © 2026 — Structural &amp; Post-Tensioning Tools</p>
        </footer>

    </div>

    <!-- Dashboard -->
    <script src="js/dashboard.js"></script>

    <!-- Calculators -->
    <script src="js/calculators/pt-spacing-rate.js"></script>
    <script src="js/calculators/punching-shear.js"></script>
    <script src="js/calculators/strut-and-tie.js"></script>
    <script src="js/calculators/integrity-reinforcement.js"></script>
    <script src="js/calculators/corbel-design.js"></script>

    <!-- PDF Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
    <script src="js/pdf-export.js"></script>

    <!-- App Core (loads last — references render functions above) -->
    <script src="js/app.js"></script>
</body>
</html>
