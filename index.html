<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Design - Engineering Tools Dashboard</title>
    <meta name="description" content="Dashboard phần mềm tính toán kết cấu Post-Tensioning">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">

        <!-- Top Navigation -->
        <nav class="top-nav">
            <a class="nav-brand" onclick="App.goHome()" id="navBrand">
                <div class="nav-logo">PT</div>
                <div>
                    <div class="nav-title">PT Design</div>
                    <div class="nav-subtitle">Engineering Tools</div>
                </div>
            </a>
            <button class="nav-back" id="navBack" onclick="App.goHome()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>Dashboard</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">

            <!-- ===== DASHBOARD VIEW ===== -->
            <div class="view active" id="dashboardView">
                <div class="dashboard-header">
                    <h1 class="dashboard-title">Engineering Tools</h1>
                    <p class="dashboard-subtitle">Chọn phần mềm tính toán để bắt đầu</p>
                </div>

                <div class="tools-grid" id="toolsGrid">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- ===== TOOL VIEW (dynamic content) ===== -->
            <div class="tool-view" id="toolView">
                <div id="toolContent">
                    <!-- Rendered by JS when a tool is selected -->
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="footer-text">PT Design © 2026 — Post-Tensioning Structural Tools</p>
        </footer>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
